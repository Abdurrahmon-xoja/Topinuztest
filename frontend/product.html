<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Product Details | Topin</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFFFFF">
    <link rel="icon" type="image/png" href="/img/icon-192.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/topin.css?v=6.4">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('houz_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
</head>
<body>

    <main class="pd-page">
        <!-- Header: back + Ortga + share -->
        <div class="shops-title-row">
            <a href="javascript:history.back()" class="back-btn" id="btnBack" aria-label="Go back">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </a>
            <h1 class="page-title" id="lblBack">Ortga</h1>
            <button class="header-icon-btn" id="productShareBtn" aria-label="Share">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                    <polyline points="16 6 12 2 8 6"></polyline>
                    <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>
            </button>
        </div>

        <!-- Breadcrumb (desktop) -->
        <div class="breadcrumb" id="productBreadcrumb"></div>

        <div class="pd-layout">
            <!-- Left: Image & Gallery -->
            <div class="pd-media">
                <div class="pd-image-box" id="primaryImageBox">
                    <img src="" alt="Product" id="primaryImage">
                    <span class="pd-3d-badge" id="pd3dBadge">3D
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    </span>
                </div>
                <div class="thumbnail-gallery" id="thumbnailGallery"></div>
            </div>

            <!-- Right: Info -->
            <div class="pd-info">
                <div class="pd-chips">
                    <span class="chip" id="productCategoryName" style="display: none;"></span>
                    <span class="chip chip-green" id="productStockBadge">–</span>
                </div>

                <h1 class="pd-title" id="productTitle">–</h1>

                <div class="pd-price" id="priceRow">
                    <span id="productPrice">–</span>
                </div>

                <!-- Shop Attribution Card -->
                <a href="" class="pd-store-card" id="shopAttribution">
                    <div class="pd-store-logo" id="shopLogo">🏪</div>
                    <div class="pd-store-info">
                        <div class="pd-store-name" id="shopAttributionName">–</div>
                        <div class="pd-store-desc" id="shopAttributionDesc"></div>
                    </div>
                    <span class="pd-store-chevron">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </span>
                </a>

                <div class="pd-actions">
                    <!-- Telegram + Phone buttons -->
                    <a href="" class="btn-tg-full" id="btnContactTelegramFull" target="_blank" rel="noopener noreferrer">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 4.1 2.9 11.3c-1 .4-1 1.3-.2 1.6l4.7 1.5 1.8 5.5c.2.6.4.8.9.8.4 0 .6-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.2-15c.3-1.2-.4-1.8-1.5-1.6zM7.9 14.1l10.4-6.6c.5-.3 1-.1.6.2l-8.9 8-.3 3.3-1.8-4.9z"/></svg>
                        <span id="lblTelegramConnect">Написать в Telegram</span>
                    </a>

                    <a href="" class="btn-phone-outline" id="btnContactPhone">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        <span id="lblContactPhone">–</span>
                    </a>

                    <!-- AR 3D download pill -->
                    <div class="pd-cta-row">
                        <button class="btn-dark-pill" id="btnDownload3D" onclick="openDownloadModal()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            <span id="lblDownload3DText">3D modelni yuklab olish</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Full-width: Tavsif + Reviews -->
            <div style="grid-column: 1 / -1; width: 100%;">
                <div class="pd-desc-card" id="descCard">
                    <div class="pd-desc-head" onclick="toggleDescCard()">
                        <h3 class="pd-desc-title" id="lblDescription">Tavsif</h3>
                        <span class="pd-desc-toggle">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
                        </span>
                    </div>
                    <div class="pd-desc-body" id="productDesc"></div>
                </div>

                <!-- Reviews Section -->
                <section class="reviews-section">
                    <h3 class="reviews-title" id="lblReviewsTitle">Fikrlar va baholar</h3>
                    <div class="reviews-list" id="reviewsList"></div>

                    <div class="review-form-container">
                        <div class="review-form-header" id="btnToggleReviewForm" onclick="toggleReviewForm()" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                            <h4 class="review-form-title" id="lblWriteReview" style="margin: 0;">Fikr qoldirish</h4>
                            <span class="toggle-icon" id="reviewToggleIcon" style="font-size: 18px; color: var(--blue);">➕</span>
                        </div>
                        <form class="review-form" id="reviewForm" onsubmit="submitReview(event)" style="display: none; margin-top: 16px;">
                            <div class="form-group">
                                <label for="reviewAuthor" id="lblYourName">Sizning ismingiz</label>
                                <input type="text" id="reviewAuthor" class="form-input" placeholder="Ismingizni kiriting..." required>
                            </div>
                            <div class="form-group">
                                <label for="reviewPhone" id="lblYourPhone">Telefon raqamingiz</label>
                                <div style="display:flex; align-items:center; gap:6px;">
                                    <span style="font-weight:600; color:var(--text2); font-size:14px; white-space:nowrap;">+998</span>
                                    <input type="tel" id="reviewPhone" class="form-input" placeholder="XX XXX XX XX" maxlength="12" required
                                           style="flex:1;" oninput="formatPhoneInput(this)">
                                </div>
                            </div>
                            <div class="form-group">
                                <label id="lblYourRating">Sizning bahoingiz</label>
                                <div class="star-rating-selector" id="starSelector">
                                    <span data-val="1">☆</span>
                                    <span data-val="2">☆</span>
                                    <span data-val="3">☆</span>
                                    <span data-val="4">☆</span>
                                    <span data-val="5">☆</span>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="reviewComment" id="lblYourComment">Fikr-mulohaza</label>
                                <textarea id="reviewComment" class="form-textarea" placeholder="Fikringizni yozing..." required></textarea>
                            </div>
                            <button type="submit" class="btn-submit-review" id="btnSubmitReview">Yuborish</button>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Mobile sticky AR bar -->
    <div class="pd-sticky-bar" id="pdStickyBar" style="display:none;">
        <button class="pd-sticky-download" id="btnStickyDownload" aria-label="Download 3D" onclick="openDownloadModal()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>
        <button class="btn-dark-pill" id="btnARSticky" onclick="triggerARFlow()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            <span id="lblViewAR">AR ko'rish</span>
        </button>
    </div>

    <!-- Floating footer controls (desktop) -->
    <footer class="site-footer hide-mobile">
        <div class="footer-controls">
            <button class="lang-toggle-btn" id="langToggleBtn" aria-label="Toggle language">
                <span class="lang-text" id="langText">UZ</span>
            </button>
            <button class="theme-switch" id="themeSwitchBtn" onclick="toggleTheme()" aria-label="Toggle theme">
                <span class="theme-switch-icon theme-switch-sun">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
                </span>
                <span class="theme-switch-thumb"></span>
                <span class="theme-switch-icon theme-switch-moon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </span>
            </button>
        </div>
    </footer>

    <!-- Embedded model-viewer Fallback Overlay -->
    <div class="viewer-container-overlay" id="viewerOverlay">
        <div class="viewer-modal-content">
            <div class="viewer-modal-header">
                <h3 id="lblModalTitle">3D modelni ko'rish</h3>
                <button class="viewer-close-btn" onclick="close3DViewer()">✕</button>
            </div>
            <div id="modelViewerWrapper" style="width:100%; height:100%;"></div>
        </div>
    </div>

    <!-- 3D Download Overlay -->
    <div class="viewer-container-overlay" id="downloadOverlay" style="display: none;">
        <div class="viewer-modal-content" style="max-height: 480px; height: auto;">
            <div class="viewer-modal-header">
                <h3 id="lblDownloadTitle">3D modelni yuklab olish</h3>
                <button class="viewer-close-btn" onclick="closeDownloadModal()">✕</button>
            </div>
            <div style="padding: 0 20px 24px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto;" id="downloadLinksContainer"></div>
        </div>
    </div>

    <!-- Toast elements -->
    <div class="toast" id="toast"></div>

    <script src="/js/config.js?v=6.4"></script>
    <script src="/js/utils.js?v=6.4"></script>
    <script>
        let product = null;
        let shop = null;
        let selectedRating = 5;

        // Parse path slugs
        const pathSegments = window.location.pathname.split('/');
        const productSlug = pathSegments.pop() || pathSegments.pop(); // last segment
        const storeSlug = pathSegments[pathSegments.indexOf('stores') + 1];

        // Device detection flags (iPadOS identifies as Macintosh with touch)
        const isIOS = (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) && !window.MSStream;
        const isAndroid = /Android/i.test(navigator.userAgent);

        function removeImageCrop(url) {
            if (!url) return '';
            return url.replace(/([?&])fit=crop/g, '$1fit=max');
        }

        function formatPrice(val, currency) {
            if (!val) return '';
            const formattedNum = parseFloat(val).toLocaleString(currentLang === 'ru' ? 'ru-RU' : 'uz-UZ');
            const cur = (currency === 'UZS' || !currency) ? (currentLang === 'ru' ? 'сум' : "so'm") : currency;
            return `${formattedNum} ${cur}`;
        }

        function renderProductDetails() {
            if (!product || !shop) return;
            const productName = getLocalizedText(product, 'name_ru', 'name');
            const shopName = getLocalizedText(shop, 'name_ru', 'name');
            document.title = `${productName} | Topin`;
            document.getElementById('lblBack').textContent = t('back');
            document.getElementById('productTitle').textContent = productName;

            const catEl = document.getElementById('productCategoryName');
            const catName = currentLang === 'ru'
                ? product.Category?.name_ru || product.Category?.name
                : product.Category?.name || product.Category?.name_ru;
            let mainCatName = '';
            if (shop.Category) {
                const translated = shop.Category.slug ? getCatName(shop.Category.slug) : '';
                mainCatName = (translated && translated !== shop.Category.slug)
                    ? translated
                    : (currentLang === 'ru' ? shop.Category.name_ru || shop.Category.name : shop.Category.name || shop.Category.name_ru);
            }
            const chipName = catName || mainCatName;
            if (chipName) {
                catEl.textContent = chipName;
                catEl.style.display = 'inline-flex';
            } else {
                catEl.style.display = 'none';
            }

            // Description
            const desc = getLocalizedText(product, 'description_ru', 'description') || getLocalizedText(product, 'shortDescription_ru', 'shortDescription') || '';
            document.getElementById('productDesc').textContent = desc;
            document.getElementById('lblDescription').textContent = t('descriptionTitle');
            document.getElementById('descCard').style.display = desc ? 'block' : 'none';

            // Pricing
            const priceRow = document.getElementById('priceRow');
            if (product.salePrice) {
                priceRow.innerHTML = `
                    <span style="color: var(--red); font-weight: 600;">${formatPrice(product.salePrice, shop.currency)}</span>
                    <span class="original-price-strikethrough">${formatPrice(product.price, shop.currency)}</span>
                `;
            } else if (product.price) {
                priceRow.innerHTML = `<span>${formatPrice(product.price, shop.currency)}</span>`;
            } else {
                priceRow.innerHTML = `<span>${t('priceOnRequest')}</span>`;
            }

            // Stock chip
            const stockBadge = document.getElementById('productStockBadge');
            const stockText = product.stockStatus === 'In Stock' ? t('inStockStatus')
                            : product.stockStatus === 'Out of Stock' ? t('outOfStockStatus')
                            : t('preorderStatus');
            const stockClass = product.stockStatus === 'In Stock' ? 'chip-green'
                             : product.stockStatus === 'Out of Stock' ? 'chip-red'
                             : 'chip-amber';
            stockBadge.textContent = stockText;
            stockBadge.className = `chip ${stockClass}`;

            // Store attribution
            document.getElementById('shopAttribution').href = `/stores/${shop.slug}`;
            document.getElementById('shopAttributionName').textContent = shopName;
            document.getElementById('shopAttributionDesc').textContent = getLocalizedText(shop, 'description_ru', 'description');
            if (shop.logoUrl) {
                document.getElementById('shopLogo').innerHTML = `<img src="${cloudinaryOptimize(shop.logoUrl)}" alt="${escHtml(shopName)}">`;
            }

            // Contacts
            const phoneBtn = document.getElementById('btnContactPhone');
            const tgBtnFull = document.getElementById('btnContactTelegramFull');
            if (shop.phone) {
                phoneBtn.style.display = 'flex';
                phoneBtn.href = `tel:${shop.phone}`;
                document.getElementById('lblContactPhone').textContent = shop.phone;
            } else {
                phoneBtn.style.display = 'none';
            }
            if (shop.telegram) {
                const tgHref = shop.telegram.startsWith('http') ? shop.telegram : `https://t.me/${shop.telegram.replace('@', '')}`;
                tgBtnFull.href = tgHref;
                tgBtnFull.style.display = 'flex';
            } else {
                tgBtnFull.style.display = 'none';
            }

            // Primary image + gallery
            if (product.imageUrl) {
                document.getElementById('primaryImage').src = cloudinaryOptimize(removeImageCrop(product.imageUrl), 800);
            }

            const thumbsEl = document.getElementById('thumbnailGallery');
            let imagesList = [];
            if (product.images) {
                try { imagesList = JSON.parse(product.images); } catch(e) {}
            }
            if (imagesList.length === 0 && product.imageUrl) {
                imagesList = [product.imageUrl];
            }

            thumbsEl.innerHTML = imagesList.map((url, i) => `
                <div class="thumb-item ${i === 0 ? 'active' : ''}" onclick="selectImage('${url}', this)">
                    <img src="${removeImageCrop(cloudinaryOptimize(url, 200))}" alt="Thumb ${i+1}" loading="lazy">
                </div>
            `).join('');
            thumbsEl.style.display = imagesList.length > 1 ? 'flex' : 'none';

            // 3D badge + buttons
            const has3D = !!(product.glbUrl || product.usdzUrl || product.zipUrl);
            const hasZip = !!product.zipUrl;

            document.getElementById('pd3dBadge').classList.toggle('visible', has3D);

            const btnDownload3D = document.getElementById('btnDownload3D');
            const stickyBar = document.getElementById('pdStickyBar');

            if (btnDownload3D) {
                btnDownload3D.style.display = hasZip ? 'flex' : 'none';
                document.getElementById('lblDownload3DText').textContent = t('download3d');
            }

            const btnStickyDownload = document.getElementById('btnStickyDownload');
            if (btnStickyDownload) {
                btnStickyDownload.style.display = hasZip ? 'flex' : 'none';
            }

            if (stickyBar) {
                stickyBar.style.display = has3D ? 'flex' : 'none';
                document.getElementById('lblViewAR').textContent = t('viewInRoom');
                document.body.style.paddingBottom = (window.innerWidth < 768 && has3D) ? '90px' : '';
            }

            // Telegram button label (always translate)
            document.getElementById('lblTelegramConnect').textContent = t('telegramConnect');

            // Breadcrumb (desktop)
            const breadcrumb = document.getElementById('productBreadcrumb');
            breadcrumb.innerHTML = `
                <a href="/">${t('homeCrumb')}</a>
                <span>/</span>
                ${mainCatName && shop.Category?.slug ? `<a href="/shops?category=${encodeURIComponent(shop.Category.slug)}">${escHtml(mainCatName)}</a><span>/</span>` : ''}
                <a href="/stores/${shop.slug}">${escHtml(shopName)}</a>
                <span>/</span>
                <span>${escHtml(productName)}</span>
            `;
        }

        function toggleDescCard() {
            document.getElementById('descCard').classList.toggle('collapsed');
        }

        async function initProductPage() {
            // Share button
            const shareBtn = document.getElementById('productShareBtn');
            if (shareBtn) {
                shareBtn.addEventListener('click', async () => {
                    const shareUrl = window.location.href;
                    if (navigator.share) {
                        try { await navigator.share({ title: product ? getLocalizedText(product, 'name_ru', 'name') : 'Topin', url: shareUrl }); } catch (e) {}
                    } else if (navigator.clipboard) {
                        try {
                            await navigator.clipboard.writeText(shareUrl);
                            showToast(t('linkCopied'), 'success');
                        } catch (e) {}
                    }
                });
            }

            try {
                const shopRes = await fetch(`/api/shops/by-slug/${encodeURIComponent(storeSlug)}`);
                if (!shopRes.ok) throw new Error('Shop not found');
                shop = (await shopRes.json()).data;

                const prodRes = await fetch(`/api/products/by-shop/${shop.id}/by-slug/${encodeURIComponent(productSlug)}`);
                if (!prodRes.ok) throw new Error('Product not found');
                product = (await prodRes.json()).data;
            } catch (err) {
                document.body.innerHTML = `<div style="text-align:center; padding:100px 20px;">
                    <h2>${t('pageNotFound')}</h2>
                    <p style="margin-top: 8px;"><a href="/" style="color:var(--blue)">Topin</a></p>
                </div>`;
                return;
            }

            renderProductDetails();
            setupStarSelector();
            await loadReviews();

            fetch('/api/analytics/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    eventType: 'product_view',
                    deviceType: window.innerWidth < 768 ? (window.innerWidth < 480 ? 'mobile' : 'tablet') : 'desktop',
                    referrer: document.referrer || 'direct',
                    shopId: shop.id,
                    productId: product.id
                })
            }).catch(e => {});
        }

        function setupStarSelector() {
            const stars = document.querySelectorAll('#starSelector span');
            if (stars.length === 0) return;

            function updateStarsVisuals(rating) {
                stars.forEach(s => {
                    const val = parseInt(s.dataset.val);
                    if (val <= rating) {
                        s.textContent = '★';
                        s.classList.add('selected');
                    } else {
                        s.textContent = '☆';
                        s.classList.remove('selected');
                    }
                });
            }

            updateStarsVisuals(selectedRating);

            stars.forEach(star => {
                star.addEventListener('mouseover', () => {
                    const hoverVal = parseInt(star.dataset.val);
                    stars.forEach(s => {
                        const val = parseInt(s.dataset.val);
                        s.classList.toggle('hovered', val <= hoverVal);
                    });
                });
                star.addEventListener('mouseout', () => {
                    stars.forEach(s => s.classList.remove('hovered'));
                });
                star.addEventListener('click', () => {
                    selectedRating = parseInt(star.dataset.val);
                    updateStarsVisuals(selectedRating);
                });
            });
        }

        async function loadReviews() {
            const listEl = document.getElementById('reviewsList');
            if (!listEl || !product) return;

            document.getElementById('lblReviewsTitle').textContent = t('reviewsTitle');
            document.getElementById('lblWriteReview').textContent = t('writeReview');

            listEl.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text3);">⏳</div>`;

            try {
                const res = await fetch(`/api/products/${product.id}/reviews`);
                if (!res.ok) throw new Error();
                const json = await res.json();
                const reviews = json.data || [];

                if (reviews.length === 0) {
                    listEl.innerHTML = `<div class="empty-reviews">${t('noReviewsYet')}</div>`;
                    return;
                }

                const isAdmin = !!localStorage.getItem('houz_token');
                listEl.innerHTML = reviews.map(r => {
                    const dateStr = new Date(r.createdAt).toLocaleDateString(currentLang === 'ru' ? 'ru-RU' : 'uz-UZ', {
                        year: 'numeric', month: 'long', day: 'numeric'
                    });
                    let starsHtml = '';
                    for (let i = 1; i <= 5; i++) starsHtml += i <= r.rating ? '★' : '☆';
                    let maskedPhone = '';
                    if (r.phone && r.phone.length >= 4) {
                        maskedPhone = `<span class="review-phone">+998 ** *** ** ${r.phone.slice(-2)}</span>`;
                    }
                    const deleteBtn = isAdmin ? `<button class="review-delete-btn" onclick="deleteProductReview(${r.id})" title="Delete">✖</button>` : '';
                    return `
                        <div class="review-item">
                            <div class="review-header">
                                <span class="review-author">${escHtml(r.authorName)} ${maskedPhone}</span>
                                <span class="review-date">${dateStr} ${deleteBtn}</span>
                            </div>
                            <div class="review-stars">${starsHtml}</div>
                            <p class="review-comment">${escHtml(r.comment)}</p>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                listEl.innerHTML = `<div class="empty-reviews">${t('noReviewsYet')}</div>`;
            }
        }

        async function deleteProductReview(reviewId) {
            if (!confirm(currentLang === 'ru' ? 'Удалить этот отзыв?' : "Bu fikrni o'chirishni xohlaysizmi?")) return;
            const token = localStorage.getItem('houz_token');
            if (!token) return;
            try {
                const res = await fetch(`/api/products/reviews/${reviewId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error();
                showToast(currentLang === 'ru' ? 'Отзыв удалён' : "Fikr o'chirildi", 'success');
                await loadReviews();
            } catch (err) {
                showToast(currentLang === 'ru' ? 'Ошибка' : 'Xatolik', 'error');
            }
        }

        function formatPhoneInput(el) {
            let digits = el.value.replace(/\D/g, '').slice(0, 9);
            let formatted = '';
            if (digits.length > 0) formatted = digits.slice(0, 2);
            if (digits.length > 2) formatted += ' ' + digits.slice(2, 5);
            if (digits.length > 5) formatted += ' ' + digits.slice(5, 7);
            if (digits.length > 7) formatted += ' ' + digits.slice(7, 9);
            el.value = formatted;
        }

        async function submitReview(event) {
            event.preventDefault();
            if (!product) return;

            const authorInput = document.getElementById('reviewAuthor');
            const phoneInput = document.getElementById('reviewPhone');
            const commentInput = document.getElementById('reviewComment');
            const btnSubmit = document.getElementById('btnSubmitReview');

            if (!commentInput.value.trim()) return;

            const phoneDigits = phoneInput.value.replace(/\D/g, '');
            if (phoneDigits.length !== 9) {
                showToast(t('reviewInvalidPhone'), 'error');
                phoneInput.focus();
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.textContent = '...';

            try {
                const res = await fetch(`/api/products/${product.id}/reviews`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        authorName: authorInput.value.trim() || 'Mehmon',
                        phone: '+998' + phoneDigits,
                        comment: commentInput.value.trim(),
                        rating: selectedRating
                    })
                });

                if (res.status === 409) {
                    showToast(t('reviewDuplicatePhone'), 'error');
                    return;
                }
                if (!res.ok) {
                    const json = await res.json().catch(() => ({}));
                    if (json.message && json.message.includes('phone')) {
                        showToast(t('reviewInvalidPhone'), 'error');
                    } else {
                        showToast(t('copyError'), 'error');
                    }
                    return;
                }

                authorInput.value = '';
                phoneInput.value = '';
                commentInput.value = '';
                selectedRating = 5;

                showToast(t('reviewSuccess'), 'success');

                const form = document.getElementById('reviewForm');
                const icon = document.getElementById('reviewToggleIcon');
                if (form) form.style.display = 'none';
                if (icon) icon.textContent = '➕';

                await loadReviews();
            } catch (err) {
                showToast(t('copyError'), 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = t('submitReviewBtn');
            }
        }

        function toggleReviewForm() {
            const form = document.getElementById('reviewForm');
            const icon = document.getElementById('reviewToggleIcon');
            if (form.style.display === 'none') {
                form.style.display = 'flex';
                icon.textContent = '➖';
            } else {
                form.style.display = 'none';
                icon.textContent = '➕';
            }
        }

        function selectImage(url, el) {
            document.getElementById('primaryImage').src = cloudinaryOptimize(removeImageCrop(url), 800);
            document.querySelectorAll('.thumb-item').forEach(thumb => thumb.classList.remove('active'));
            if (el) el.classList.add('active');
        }

        function triggerARFlow() {
            if (!product) return;

            const hasGlb = !!product.glbUrl;
            const hasUsdz = !!product.usdzUrl;

            fetch('/api/analytics/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    eventType: 'ar_load',
                    deviceType: window.innerWidth < 768 ? (window.innerWidth < 480 ? 'mobile' : 'tablet') : 'desktop',
                    referrer: document.referrer || 'direct',
                    shopId: shop.id,
                    productId: product.id
                })
            }).catch(e => {});

            if (isIOS) {
                if (hasUsdz) {
                    // iOS AR Quick Look needs absolute URL and anchor in the DOM
                    const usdzAbsolute = product.usdzUrl.startsWith('http')
                        ? product.usdzUrl
                        : window.location.origin + product.usdzUrl;
                    const anchor = document.createElement('a');
                    anchor.setAttribute('rel', 'ar');
                    anchor.setAttribute('href', usdzAbsolute);
                    anchor.style.display = 'none';
                    const img = document.createElement('img');
                    img.src = product.imageUrl || '';
                    anchor.appendChild(img);
                    document.body.appendChild(anchor);
                    anchor.click();
                    setTimeout(() => anchor.remove(), 1000);
                } else if (hasGlb) {
                    open3DViewer();
                } else {
                    showToast(currentLang === 'ru' ? '3D модель недоступна' : '3D model mavjud emas', 'error');
                }
            } else if (isAndroid) {
                if (hasGlb) {
                    // Scene Viewer needs an absolute URL — glbUrl may be relative (/uploads/...)
                    const glbAbsolute = product.glbUrl.startsWith('http') 
                        ? product.glbUrl 
                        : window.location.origin + product.glbUrl;
                    const fallbackUrl = window.location.href;
                    const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(glbAbsolute)}&mode=ar_only&title=${encodeURIComponent(product.name || '')}#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(fallbackUrl)};end`;
                    window.location.href = intentUrl;
                } else {
                    showToast(currentLang === 'ru' ? '3D модель недоступна' : '3D model mavjud emas', 'error');
                }
            } else {
                openDownloadModal();
            }
        }

        function openDownloadModal() {
            if (!product) return;
            const container = document.getElementById('downloadLinksContainer');
            container.innerHTML = '';

            const titleEl = document.getElementById('lblDownloadTitle');
            if (titleEl) titleEl.textContent = t('download3d');

            let hasAny = false;
            const files = [
                {
                    key: 'zipUrl',
                    label: currentLang === 'ru' ? 'ZIP архив для дизайнеров' : 'Dizaynerlar uchun ZIP arxiv',
                    desc: currentLang === 'ru' ? '3D MAX, OBJ, FBX + текстуры' : '3D MAX, OBJ, FBX + teksturalar',
                    icon: '📁',
                    ext: 'ZIP'
                },
                {
                    key: 'glbUrl',
                    label: currentLang === 'ru' ? '3D модель (GLB)' : '3D model (GLB)',
                    desc: currentLang === 'ru' ? 'Для Android и веб-браузеров' : 'Android va veb-brauzerlar uchun',
                    icon: '📦',
                    ext: 'GLB',
                    previewable: true
                },
                {
                    key: 'usdzUrl',
                    label: currentLang === 'ru' ? '3D модель (USDZ)' : '3D model (USDZ)',
                    desc: currentLang === 'ru' ? 'Для Apple iOS Quick Look' : 'Apple iOS Quick Look uchun',
                    icon: '📱',
                    ext: 'USDZ'
                }
            ];

            files.forEach(f => {
                const url = product[f.key];
                if (url) {
                    hasAny = true;

                    let previewBtn = '';
                    if (f.previewable) {
                        previewBtn = `
                            <button onclick="closeDownloadModal(); open3DViewer();" class="btn-secondary-contact" style="width:100%;">
                                ${currentLang === 'ru' ? 'Просмотр в 3D' : '3D-da ko\'rish'}
                            </button>
                        `;
                    }

                    container.innerHTML += `
                        <div class="download-file-card">
                            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%;">
                                <div style="display:flex; align-items:center; gap:12px; min-width:0;">
                                    <div style="font-size:22px; background:var(--white-box); width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:12px; flex-shrink:0;">${f.icon}</div>
                                    <div style="min-width:0;">
                                        <div style="font-weight:700; color:var(--text); font-size:14px;">${f.label}</div>
                                        <div style="font-size:12px; color:var(--text2);">${f.desc}</div>
                                    </div>
                                </div>
                                <a href="${url}" target="_blank" download="${product.slug || 'product'}.${f.ext.toLowerCase()}" class="btn-primary-ar" style="text-decoration:none; white-space:nowrap;">
                                    ${currentLang === 'ru' ? 'Скачать' : 'Yuklab olish'}
                                </a>
                            </div>
                            ${previewBtn}
                        </div>
                    `;
                }
            });

            if (!hasAny) {
                container.innerHTML = `<div style="text-align:center; color:var(--text3); padding:20px;">${currentLang === 'ru' ? 'Файлы недоступны' : 'Fayllar mavjud emas'}</div>`;
            }

            document.getElementById('downloadOverlay').style.display = 'flex';
        }

        function closeDownloadModal() {
            document.getElementById('downloadOverlay').style.display = 'none';
        }

        function open3DViewer() {
            if (!product.glbUrl) return;

            if (!window.customElements.get('model-viewer')) {
                const script = document.createElement('script');
                script.type = 'module';
                script.src = 'https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js';
                document.head.appendChild(script);
            }

            const wrapper = document.getElementById('modelViewerWrapper');
            wrapper.innerHTML = `
                <model-viewer src="${product.glbUrl}"
                              alt="${escHtml(getLocalizedText(product, 'name_ru', 'name'))}"
                              ar
                              camera-controls
                              auto-rotate
                              style="width: 100%; height: 100%;">
                </model-viewer>
            `;

            document.getElementById('viewerOverlay').style.display = 'flex';
        }

        function close3DViewer() {
            document.getElementById('viewerOverlay').style.display = 'none';
            document.getElementById('modelViewerWrapper').innerHTML = '';
        }

        document.addEventListener('DOMContentLoaded', initProductPage);

        window.addEventListener('langchange', () => {
            renderProductDetails();
            loadReviews();
        });
    </script>
</body>
</html>
