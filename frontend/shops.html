<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description"
        content="Topin — Do'konlar ro'yxati. Kategoriya bo'yicha filtrlash va do'kon ma'lumotlarini ko'rish.">
    <title>Topin</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Topin">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="css/topin.css?v=4.1">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('houz_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
</head>

<body>

    <main class="shops-page">
        <!-- Title row: back + category title + layout toggle -->
        <div class="shops-title-row">
            <a href="/" class="back-btn" aria-label="Go back">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </a>
            <h1 class="page-title" id="pageTitle">–</h1>
            <button class="header-icon-btn" id="toggleLayoutBtn" onclick="toggleLayoutMode()" aria-label="Toggle layout mode">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="layoutToggleIcon">
                    <rect x="4" y="4" width="6" height="16" rx="1"></rect>
                    <rect x="14" y="4" width="6" height="16" rx="1"></rect>
                </svg>
            </button>
        </div>

        <div id="homeView">
            <!-- Subcategory chips -->
            <div class="cat-tabs-scroll">
                <div class="markets-categories" id="catTabs">
                    <!-- Injected via JS -->
                </div>
            </div>

            <!-- Found count -->
            <div class="found-count" id="shopCount"></div>

            <!-- Shops Grid -->
            <div class="shops-wrap">
                <div class="shops-grid" id="shopsGrid">
                    <div class="loader" id="shopLoader"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating footer controls (desktop) -->
    <footer class="site-footer hide-mobile">
        <div class="footer-controls">
            <div class="lang-wrap" id="langWrap">
                <button class="lang-switch-btn" id="langBtn" aria-label="Change Language">
                    <span class="lang-text">UZ</span>
                    <svg class="lang-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="lang-dropdown" id="langDropdown">
                    <div class="lang-option" data-lang="uz">
                        O'zbek
                        <svg class="lang-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <div class="lang-option" data-lang="ru">
                        Русский
                        <svg class="lang-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>
            </div>

            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle theme">
                <span class="theme-icon theme-icon-sun">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
                </span>
                <span class="theme-icon theme-icon-moon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </span>
            </button>
        </div>
    </footer>

    <!-- Shop Detail Modal -->
    <div class="modal-overlay" id="shopModal" style="display:none;" role="dialog" aria-modal="true">
        <div class="modal-sheet" id="modalSheet">
            <div class="modal-header">
                <button class="btn-modal-share" id="modalShareBtn" aria-label="Ulashish">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                        <polyline points="16 6 12 2 8 6"></polyline>
                        <line x1="12" y1="2" x2="12" y2="15"></line>
                    </svg>
                </button>
                <button class="modal-close" id="modalClose" aria-label="Yopish">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="modal-body">
                <!-- 1. Image Carousel -->
                <div class="shop-carousel" id="shopCarousel"></div>

                <!-- 2. Logo + Name + Description -->
                <div class="modal-profile-row">
                    <div class="modal-logo" id="modalLogo">🏪</div>
                    <div class="modal-profile-info">
                        <h2 class="modal-shop-name" id="modalName">–</h2>
                        <p class="modal-shop-desc" id="modalDescFull"></p>
                    </div>
                </div>

                <!-- 3. Social pills + Location card -->
                <div class="modal-details-grid">
                    <div class="modal-pills" id="modalRows"></div>

                    <div class="modal-loc-card" id="modalLoc">
                        <div class="modal-loc-head">
                            <img src="img/icons/Location icon.svg" alt="" class="modal-loc-icon">
                            <span class="modal-loc-title" id="modalLocTitle">Joylashuv</span>
                            <span class="modal-loc-directions" id="modalDirectionsBtn">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M10.94 2.44a1.5 1.5 0 0 1 2.12 0l8.5 8.5a1.5 1.5 0 0 1 0 2.12l-8.5 8.5a1.5 1.5 0 0 1-2.12 0l-8.5-8.5a1.5 1.5 0 0 1 0-2.12z"></path>
                                    <path d="M9.5 13.7v-1.6a1.2 1.2 0 0 1 1.2-1.2h3.6"></path>
                                    <path d="M12.6 8.9l2 2-2 2"></path>
                                </svg>
                            </span>
                        </div>
                        <div class="modal-loc-text" id="modalLocText">–</div>
                    </div>
                </div>

                <!-- 4. Store Products -->
                <div class="modal-products-section" id="modalProductsSection" style="display: none;">
                    <div class="modal-products-header">
                        <h3 class="modal-products-title" id="modalProductsTitle">Mahsulotlar</h3>
                        <a class="modal-all-btn" id="modalAllBtn" href="#">
                            <span id="modalAllBtnText">Hammasi</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </a>
                    </div>
                    <div class="modal-products-scroll" id="modalProductsGrid"></div>
                </div>

                <!-- 5. Reviews -->
                <div class="reviews-section">
                    <h3 class="reviews-title" id="lblReviewsTitle">Fikrlar va baholar</h3>
                    <div id="modalRatingContainer" style="display:none;"></div>
                    <div class="reviews-list" id="modalReviewsList"></div>

                    <div class="review-form-container">
                        <div class="review-form-header" id="btnToggleModalReviewForm" onclick="toggleModalReviewForm()" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                            <h4 class="review-form-title" id="lblWriteReview" style="margin: 0;">Fikr qoldirish</h4>
                            <span class="toggle-icon" id="modalReviewToggleIcon" style="font-size: 18px; color: var(--blue);">➕</span>
                        </div>
                        <form class="review-form" id="modalReviewForm" onsubmit="submitModalReview(event)" style="display: none; margin-top: 16px;">
                            <div class="form-group">
                                <label for="modalReviewAuthor" id="lblYourName">Sizning ismingiz</label>
                                <input type="text" id="modalReviewAuthor" class="form-input" placeholder="Ismingizni kiriting..." required>
                            </div>
                            <div class="form-group">
                                <label id="lblYourRating">Sizning bahoingiz</label>
                                <div class="star-rating-selector" id="modalStarSelector">
                                    <span data-val="1">☆</span>
                                    <span data-val="2">☆</span>
                                    <span data-val="3">☆</span>
                                    <span data-val="4">☆</span>
                                    <span data-val="5">☆</span>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="modalReviewComment" id="lblYourComment">Fikr-mulohaza</label>
                                <textarea id="modalReviewComment" class="form-textarea" placeholder="Fikringizni yozing..." required></textarea>
                            </div>
                            <button type="submit" class="btn-submit-review" id="btnSubmitReview">Yuborish</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Bottom Action Buttons -->
            <div class="modal-sticky-actions" id="modalStickyActions" style="display: none;">
                <a class="btn-tg-pill" id="modalTgActionBtn" href="#" target="_blank" rel="noopener noreferrer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21.6 4.1 2.9 11.3c-1 .4-1 1.3-.2 1.6l4.7 1.5 1.8 5.5c.2.6.4.8.9.8.4 0 .6-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.2-15c.3-1.2-.4-1.8-1.5-1.6zM7.9 14.1l10.4-6.6c.5-.3 1-.1.6.2l-8.9 8-.3 3.3-1.8-4.9z"/>
                    </svg>
                    <span class="btn-pill-label" id="modalTgLabel">Telegramda bog'lanish</span>
                </a>
                <a class="btn-phone-pill" id="modalPhoneActionBtn" href="#">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <span id="modalPhoneActionText">+998 71 379 0102</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Floating Bottom Search Bar for Mobile -->
    <div class="floating-search-bar" id="floatingSearchBar">
        <div class="floating-search-inner">
            <div class="floating-search-input-wrap">
                <span class="floating-search-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <input type="text" id="floatingSearchInput" placeholder="Qidiruv..." aria-label="Search">
                <button class="clear-search-btn" id="clearFloatingSearchBtn" style="display: none;">✕</button>
            </div>
            <button class="back-circle-btn" onclick="history.back()" aria-label="Go back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <script src="js/config.js?v=4.1"></script>
    <script src="js/utils.js?v=4.1"></script>
    <script src="js/market.js?v=4.1"></script>
    <script src="js/home.js?v=4.1"></script>
    <script src="js/modal.js?v=4.1"></script>
</body>

</html>
