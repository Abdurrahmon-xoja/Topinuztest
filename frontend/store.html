<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Storefront | Topin</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFFFFF">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/topin.css?v=4.3">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('houz_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
    <style>
        .store-sticky-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 250;
            padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
            display: flex;
            gap: 10px;
            pointer-events: none;
        }
        .store-sticky-bar > * { pointer-events: auto; }
        .store-sticky-tg {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--tg);
            color: #fff;
            flex-shrink: 0;
            box-shadow: var(--shadow);
        }
        .store-sticky-phone {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 52px;
            flex: 1;
            border-radius: 50px;
            background: var(--dark);
            color: var(--dark-text);
            font-size: 15px;
            font-weight: 600;
            box-shadow: var(--shadow);
        }
        @media (min-width: 768px) {
            .store-sticky-bar { display: none !important; }
        }
    </style>
</head>
<body>

    <!-- Header: back + store name + share -->
    <main class="store-page">
        <div class="shops-title-row">
            <a href="/" class="back-btn" id="backBtn" aria-label="Go back">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </a>
            <h1 class="page-title" id="storeName">–</h1>
            <button class="header-icon-btn" id="storeShareBtn" aria-label="Share">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                    <polyline points="16 6 12 2 8 6"></polyline>
                    <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>
            </button>
        </div>

        <!-- Hero card -->
        <div class="store-hero-card" style="margin-top: 8px;">
            <div class="store-hero-logo" id="storeLogo">🏪</div>
            <div class="store-hero-name-row">
                <span class="store-hero-name" id="storeHeroName">–</span>
                <span class="store-hero-chip" id="storeCategoryChip" style="display:none;"></span>
            </div>
            <p class="store-hero-desc" id="storeTagline"></p>
        </div>

        <!-- Subcategory filter pills -->
        <div class="cat-tabs-scroll" id="subcatTabs" style="display:none;">
            <div class="markets-categories" id="subcatPills"></div>
        </div>

        <!-- Product count -->
        <div class="store-count-row" id="productCount"></div>

        <!-- Products grid -->
        <div class="products-grid" id="productGrid">
            <!-- Skeletons loaded initially -->
        </div>

        <!-- Reviews -->
        <div class="reviews-section" id="storeReviewsSection">
            <h3 class="reviews-title" id="lblReviewsTitle">Fikrlar va baholar</h3>
            <div class="reviews-list" id="reviewsList"></div>

            <div class="review-form-container">
                <div class="review-form-header" id="btnToggleReviewForm" onclick="toggleReviewForm()" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <h4 class="review-form-title" id="lblWriteReview" style="margin: 0;">Fikr qoldirish</h4>
                    <span class="toggle-icon" id="reviewToggleIcon" style="font-size: 18px; color: var(--blue);">➕</span>
                </div>
                <form class="review-form" id="reviewForm" onsubmit="submitReview(event)" style="display: none; margin-top: 16px;">
                    <div class="form-group">
                        <label for="reviewAuthor" id="lblYourName">Sizning ismingiz</label>
                        <input type="text" id="reviewAuthor" class="form-input" placeholder="Ismingizni kiriting..." required>
                    </div>
                    <div class="form-group">
                        <label id="lblYourRating">Sizning bahoingiz</label>
                        <div class="star-rating-selector" id="starSelector">
                            <span data-val="1">☆</span>
                            <span data-val="2">☆</span>
                            <span data-val="3">☆</span>
                            <span data-val="4">☆</span>
                            <span data-val="5">☆</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="reviewComment" id="lblYourComment">Fikr-mulohaza</label>
                        <textarea id="reviewComment" class="form-textarea" placeholder="Fikringizni yozing..." required></textarea>
                    </div>
                    <button type="submit" class="btn-submit-review" id="btnSubmitReview">Yuborish</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Mobile sticky contact bar -->
    <div class="store-sticky-bar" id="storeStickyBar" style="display:none;">
        <a class="store-sticky-tg" id="stickyTgBtn" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 4.1 2.9 11.3c-1 .4-1 1.3-.2 1.6l4.7 1.5 1.8 5.5c.2.6.4.8.9.8.4 0 .6-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.2-15c.3-1.2-.4-1.8-1.5-1.6zM7.9 14.1l10.4-6.6c.5-.3 1-.1.6.2l-8.9 8-.3 3.3-1.8-4.9z"/></svg>
        </a>
        <a class="store-sticky-phone" id="stickyPhoneBtn" href="#" style="display:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            <span id="stickyPhoneText"></span>
        </a>
    </div>

    <!-- Floating footer controls (desktop) -->
    <footer class="site-footer hide-mobile">
        <div class="footer-controls">
            <div class="lang-wrap" id="langWrap">
                <button class="lang-switch-btn" id="langBtn" aria-label="Change Language">
                    <span class="lang-text">UZ</span>
                    <svg class="lang-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
                <div class="lang-dropdown" id="langDropdown">
                    <div class="lang-option" data-lang="uz">
                        O'zbek
                        <svg class="lang-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <div class="lang-option" data-lang="ru">
                        Русский
                        <svg class="lang-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>
            </div>

            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle theme">
                <span class="theme-icon theme-icon-sun">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
                </span>
                <span class="theme-icon theme-icon-moon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </span>
            </button>
        </div>
    </footer>

    <!-- Toast UI element -->
    <div class="toast" id="toast"></div>

    <script src="/js/config.js?v=4.3"></script>
    <script src="/js/utils.js?v=4.3"></script>
    <script>
        let shop = null;
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const storeSlug = pathSegments[pathSegments.indexOf('stores') + 1];

        function renderStorefrontDetails() {
            if (!shop) return;
            document.title = `${shop.name} | Topin`;
            document.getElementById('storeName').textContent = shop.name;
            document.getElementById('storeHeroName').textContent = shop.name;

            const tagline = getLocalizedText(shop, 'description_ru', 'description');
            const taglineEl = document.getElementById('storeTagline');
            taglineEl.textContent = tagline;
            taglineEl.style.display = tagline ? 'block' : 'none';

            // Category chip
            const chip = document.getElementById('storeCategoryChip');
            let catName = '';
            if (shop.Category) {
                const translated = shop.Category.slug ? getCatName(shop.Category.slug) : '';
                catName = (translated && translated !== shop.Category.slug)
                    ? translated
                    : (currentLang === 'ru' ? shop.Category.name_ru || shop.Category.name : shop.Category.name || shop.Category.name_ru);
            }
            if (catName) {
                chip.textContent = catName;
                chip.style.display = 'inline-flex';
            } else {
                chip.style.display = 'none';
            }

            if (shop.logoUrl) {
                document.getElementById('storeLogo').innerHTML = `<img src="${cloudinaryOptimize(shop.logoUrl)}" alt="${escHtml(shop.name)}">`;
            }

            // Mobile sticky contact bar
            const bar = document.getElementById('storeStickyBar');
            const tgBtn = document.getElementById('stickyTgBtn');
            const phoneBtn = document.getElementById('stickyPhoneBtn');
            if (shop.telegram || shop.phone) {
                bar.style.display = 'flex';
                if (shop.telegram) {
                    tgBtn.style.display = 'flex';
                    tgBtn.href = shop.telegram.startsWith('http') ? shop.telegram : `https://t.me/${shop.telegram.replace('@', '')}`;
                }
                if (shop.phone) {
                    phoneBtn.style.display = 'flex';
                    phoneBtn.href = `tel:${escHtml(shop.phone)}`;
                    document.getElementById('stickyPhoneText').textContent = shop.phone;
                }
            } else {
                bar.style.display = 'none';
            }
        }

        async function initStorefront() {
            // Set dynamic back button href
            const urlParams = new URLSearchParams(window.location.search);
            const fromCat = urlParams.get('fromCategory');
            const backBtn = document.getElementById('backBtn');
            if (backBtn) {
                if (fromCat && fromCat !== 'all') {
                    backBtn.href = `/shops?category=${encodeURIComponent(fromCat)}`;
                } else if (document.referrer && (document.referrer.includes('/shops') || document.referrer.includes(window.location.host))) {
                    backBtn.href = 'javascript:history.back()';
                } else {
                    backBtn.href = '/';
                }
            }

            // Share button
            const shareBtn = document.getElementById('storeShareBtn');
            if (shareBtn) {
                shareBtn.addEventListener('click', async () => {
                    const shareUrl = window.location.href;
                    if (navigator.share) {
                        try { await navigator.share({ title: shop ? shop.name : 'Topin', url: shareUrl }); } catch (e) {}
                    } else if (navigator.clipboard) {
                        try {
                            await navigator.clipboard.writeText(shareUrl);
                            showToast(t('linkCopied'), 'success');
                        } catch (e) {}
                    }
                });
            }

            // Load Store profile
            try {
                const res = await fetch(`/api/shops/by-slug/${encodeURIComponent(storeSlug)}`);
                if (!res.ok) throw new Error('Shop not found');
                const json = await res.json();
                shop = json.data;
            } catch (err) {
                document.body.innerHTML = `<div style="text-align:center; padding:100px 20px; font-family: inherit;">
                    <h2>${t('pageNotFound')}</h2>
                    <p style="margin-top: 8px;"><a href="/" style="color:var(--blue)">Topin</a></p>
                </div>`;
                return;
            }

            renderStorefrontDetails();
            setupStarSelector();
            await fetchStoreProducts();
            loadReviews();

            // Send tracking page_view event
            fetch('/api/analytics/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    eventType: 'page_view',
                    deviceType: window.innerWidth < 768 ? (window.innerWidth < 480 ? 'mobile' : 'tablet') : 'desktop',
                    referrer: document.referrer || 'direct',
                    shopId: shop.id
                })
            }).catch(e => {});
        }

        async function fetchStoreProducts() {
            const grid = document.getElementById('productGrid');

            // Display skeletons
            grid.innerHTML = Array(8).fill().map(() => `
                <div class="skeleton-card" style="height: 280px; border-radius: 22px;"></div>
            `).join('');

            try {
                const res = await fetch(`/api/shops/${shop.id}/products?limit=100`);
                const json = await res.json();
                _allProducts = json.data || [];

                renderSubcatPills();
                renderProductGrid();
            } catch (err) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--red);">
                    <p>${t('uploadError')}</p>
                </div>`;
            }
        }

        let _allProducts = [];
        let _activeSubcat = 'all';

        function renderSubcatPills() {
            const subs = new Map();
            _allProducts.forEach(p => {
                if (p.SubCategory) subs.set(p.SubCategory.id, p.SubCategory);
            });
            if (subs.size < 2) return;

            const subName = (s) => (currentLang === 'ru' ? (s.name_ru || s.name) : s.name);
            const sorted = [...subs.values()].sort((a, b) => (a.order || 0) - (b.order || 0));
            const pillsEl = document.getElementById('subcatPills');
            pillsEl.innerHTML =
                `<button class="cat-pill active" data-sub="all">${t('hammasi')}</button>` +
                sorted.map(s => `<button class="cat-pill" data-sub="${s.id}">${escHtml(subName(s))}</button>`).join('');
            document.getElementById('subcatTabs').style.display = '';

            pillsEl.querySelectorAll('.cat-pill').forEach(btn => {
                btn.onclick = () => {
                    _activeSubcat = btn.dataset.sub === 'all' ? 'all' : parseInt(btn.dataset.sub);
                    pillsEl.querySelectorAll('.cat-pill').forEach(x => x.classList.toggle('active', x === btn));
                    renderProductGrid();
                };
            });
        }

        function renderProductGrid() {
            const grid = document.getElementById('productGrid');
            const products = _activeSubcat === 'all'
                ? _allProducts
                : _allProducts.filter(p => p.SubCategoryId === _activeSubcat);

            const countEl = document.getElementById('productCount');
            countEl.innerHTML = currentLang === 'ru'
                ? `${t('productLabel')} <b>${products.length}</b>`
                : `${t('productLabel')} <b>${products.length} ta</b>`;

            if (products.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text3);">
                    <p>${t('notFound')}</p>
                </div>`;
                return;
            }

            grid.innerHTML = products.map(prod => {
                    const hasModel = prod.glbUrl || prod.usdzUrl;
                    const arBadgeHtml = `
                        <div class="product-card-ar-badge">${hasModel ? '3D' : ''}
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                        </div>`;

                    const priceStr = prod.price
                        ? `${parseFloat(prod.price).toLocaleString()} ${shop.currency === 'UZS' || !shop.currency ? "so'm" : shop.currency}`
                        : t('priceOnRequest');

                    return `
                        <a href="/stores/${shop.slug}/products/${prod.slug}" class="product-card">
                            <div class="product-card-img-wrap">
                                <img src="${cloudinaryOptimize(prod.imageUrl || '/img/placeholder.png')}" alt="${escHtml(prod.name)}" class="product-card-img" loading="lazy">
                                ${arBadgeHtml}
                            </div>
                            <div class="product-card-content">
                                <span class="product-card-shop">${escHtml(shop.name)}</span>
                                <h3 class="product-card-name">${escHtml(prod.name)}</h3>
                                <div class="product-card-price-row">
                                    <span class="product-card-price">${priceStr}</span>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
        }

        let selectedRating = 5;

        function setupStarSelector() {
            const stars = document.querySelectorAll('#starSelector span');
            if (stars.length === 0) return;

            function updateStarsVisuals(rating) {
                stars.forEach(s => {
                    const val = parseInt(s.dataset.val);
                    if (val <= rating) {
                        s.textContent = '★';
                        s.classList.add('selected');
                    } else {
                        s.textContent = '☆';
                        s.classList.remove('selected');
                    }
                });
            }

            updateStarsVisuals(selectedRating);

            stars.forEach(star => {
                star.addEventListener('mouseover', () => {
                    const hoverVal = parseInt(star.dataset.val);
                    stars.forEach(s => {
                        const val = parseInt(s.dataset.val);
                        s.classList.toggle('hovered', val <= hoverVal);
                    });
                });
                star.addEventListener('mouseout', () => {
                    stars.forEach(s => s.classList.remove('hovered'));
                });
                star.addEventListener('click', () => {
                    selectedRating = parseInt(star.dataset.val);
                    updateStarsVisuals(selectedRating);
                });
            });
        }

        async function loadReviews() {
            const listEl = document.getElementById('reviewsList');
            if (!listEl || !shop) return;

            document.getElementById('lblReviewsTitle').textContent = t('reviewsTitle');
            document.getElementById('lblWriteReview').textContent = t('writeReview');

            listEl.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text3);">⏳</div>`;

            try {
                const res = await fetch(`/api/shops/${shop.id}/reviews`);
                if (!res.ok) throw new Error();
                const json = await res.json();
                const reviews = json.data || [];

                if (reviews.length === 0) {
                    listEl.innerHTML = `<div class="empty-reviews">${t('noReviewsYet')}</div>`;
                    return;
                }

                listEl.innerHTML = reviews.map(r => {
                    const dateStr = new Date(r.createdAt).toLocaleDateString(currentLang === 'ru' ? 'ru-RU' : 'uz-UZ', {
                        year: 'numeric', month: 'long', day: 'numeric'
                    });
                    let starsHtml = '';
                    for (let i = 1; i <= 5; i++) starsHtml += i <= r.rating ? '★' : '☆';
                    return `
                        <div class="review-item">
                            <div class="review-header">
                                <span class="review-author">${escHtml(r.authorName)}</span>
                                <span class="review-date">${dateStr}</span>
                            </div>
                            <div class="review-stars">${starsHtml}</div>
                            <p class="review-comment">${escHtml(r.comment)}</p>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                listEl.innerHTML = `<div class="empty-reviews">${t('noReviewsYet')}</div>`;
            }
        }

        async function submitReview(event) {
            event.preventDefault();
            if (!shop) return;

            const authorInput = document.getElementById('reviewAuthor');
            const commentInput = document.getElementById('reviewComment');
            const btnSubmit = document.getElementById('btnSubmitReview');

            if (!commentInput.value.trim()) return;

            btnSubmit.disabled = true;
            btnSubmit.textContent = '...';

            try {
                const res = await fetch(`/api/shops/${shop.id}/reviews`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        authorName: authorInput.value.trim() || 'Mehmon',
                        comment: commentInput.value.trim(),
                        rating: selectedRating
                    })
                });

                if (!res.ok) throw new Error();

                authorInput.value = '';
                commentInput.value = '';
                selectedRating = 5;

                showToast(t('reviewSuccess'), 'success');

                const form = document.getElementById('reviewForm');
                const icon = document.getElementById('reviewToggleIcon');
                if (form) form.style.display = 'none';
                if (icon) icon.textContent = '➕';

                await loadReviews();
            } catch (err) {
                showToast(t('copyError'), 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = t('submitReviewBtn');
            }
        }

        function toggleReviewForm() {
            const form = document.getElementById('reviewForm');
            const icon = document.getElementById('reviewToggleIcon');
            if (form.style.display === 'none') {
                form.style.display = 'flex';
                icon.textContent = '➖';
            } else {
                form.style.display = 'none';
                icon.textContent = '➕';
            }
        }

        document.addEventListener('DOMContentLoaded', initStorefront);

        window.addEventListener('langchange', () => {
            renderStorefrontDetails();
            fetchStoreProducts();
            loadReviews();
        });
    </script>
</body>
</html>
