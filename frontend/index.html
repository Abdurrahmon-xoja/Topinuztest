<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Topin</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Topin">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="css/topin.css?v=5.3">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('houz_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="home-logo">
                <span class="logo-text-top">TOP</span><span class="logo-text-in">IN</span>
            </a>

            <!-- Right icons (Search + Menu) -->
            <div class="header-right-actions">
                <button class="header-icon-btn" id="desktopSearchTrigger" aria-label="Search">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                <button class="header-icon-btn" id="menuBurgerBtn" aria-label="Menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo"><span class="logo-text-top">TOP</span><span class="logo-text-in">IN</span></span>
            <button class="sidebar-close-btn" onclick="closeSidebar()" aria-label="Close">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <nav class="sidebar-nav">
            <a href="/shops" class="sidebar-nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span data-i18n="allShops">Barcha do'konlar</span>
            </a>
        </nav>

        <div class="sidebar-section">
            <h4 class="sidebar-section-title" data-i18n="aboutCompany">Kompaniya haqida</h4>
            <div class="sidebar-company-name">OOO GRACE PROJECTS</div>
            <a class="sidebar-info-row" href="tel:+998971310023">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                <span>+998 97 131 00 23</span>
            </a>
            <a class="sidebar-info-row" href="https://maps.google.com/?q=Tashkent+Mahtumkuli+114A" target="_blank" rel="noopener noreferrer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span>г. Ташкент, ул. Махтумкули, 114А</span>
            </a>
        </div>

        <div class="sidebar-section sidebar-section-bottom">
            <a href="/privacy" class="sidebar-privacy-link" data-i18n="privacyPolicy">Maxfiylik siyosati</a>
            <div class="sidebar-copyright">© 2025 Topin. OOO GRACE PROJECTS</div>
        </div>
    </aside>

    <main class="home-layout">
        <!-- Main Home View -->
        <div id="homeView" style="display:flex; flex:1; width:100%;">
            <!-- Product Categories Grid -->
            <div class="home-grid" id="homeGrid">
                <!-- Categories injected via JS -->
            </div>
        </div>

        <!-- Search Results View (full-page takeover) -->
        <div id="searchView" class="search-view" style="display: none;">
            <!-- Search Input Bar -->
            <div class="search-fullpage-bar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchFullpageInput" placeholder="Qidiruv...">
                <button class="search-close-circle" id="closeSearchBtn" aria-label="Close search">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <!-- Featured Stores Row -->
            <h3 class="search-stores-title" id="lblRecommendedStores">Tavsiya etilgan do'konlar</h3>
            <div class="search-stores-row" id="searchStoresRow">
                <!-- Loaded via JS -->
            </div>

            <!-- Search Results -->
            <div id="searchResultsArea">
                <div class="search-results-count" id="searchResultsCount" style="display:none;"></div>
                <div class="search-results-list" id="searchResultsList"></div>
                <div class="no-results-msg" id="noResultsMsg" style="display: none;">Hech narsa topilmadi</div>
            </div>
        </div>

        <!-- hidden legacy header input (search open handled by icon) -->
        <input type="text" id="headerSearchInput" style="display:none;" aria-hidden="true" tabindex="-1">
    </main>

    <!-- Floating footer controls -->
    <footer class="site-footer">
        <div class="footer-controls">
            <!-- Language Toggle (simple button, no dropdown) -->
            <button class="lang-toggle-btn" id="langToggleBtn" aria-label="Toggle language">
                <span class="lang-text" id="langText">UZ</span>
            </button>

            <!-- Theme Toggle Switch -->
            <button class="theme-switch" id="themeSwitchBtn" onclick="toggleTheme()" aria-label="Toggle theme">
                <span class="theme-switch-icon theme-switch-sun">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
                </span>
                <span class="theme-switch-thumb"></span>
                <span class="theme-switch-icon theme-switch-moon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </span>
            </button>

            <!-- Support info -->
            <button type="button" class="footer-info-btn" id="footerInfoBtn" aria-label="Информация">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            </button>
        </div>
    </footer>

    <div class="footer-info-panel" id="footerInfoPanel">
        <h4 class="footer-info-title">Связаться с поддержкой</h4>
        <a class="footer-info-row" href="tel:+998971310023">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            <span>+998 97 131 00 23</span>
        </a>
        <a class="footer-info-row" href="https://maps.google.com/?q=Tashkent+Mahtumkuli+114A" target="_blank" rel="noopener noreferrer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span>г. Ташкент, ул. Махтумкули, 114А</span>
        </a>
    </div>

    <script src="js/config.js?v=5.3"></script>
    <script src="js/utils.js?v=5.3"></script>
    <script src="js/home.js?v=5.3"></script>

</body>

</html>
