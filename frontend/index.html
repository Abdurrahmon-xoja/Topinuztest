<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Topin</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Topin">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="css/topin.css?v=4.7">
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('houz_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="home-logo">
                <span class="logo-text-top">TOP</span><span class="logo-text-in">IN</span>
            </a>

            <!-- Right icons (Search + Menu) -->
            <div class="header-right-actions">
                <button class="header-icon-btn" id="desktopSearchTrigger" aria-label="Search">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                <a href="/shops" class="header-icon-btn" aria-label="Menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <main class="home-layout">
        <!-- Main Home View -->
        <div id="homeView" style="display:flex; flex:1; width:100%;">
            <!-- Product Categories Grid -->
            <div class="home-grid" id="homeGrid">
                <!-- Categories injected via JS -->
            </div>
        </div>

        <!-- Search Results View (full-page takeover) -->
        <div id="searchView" class="search-view" style="display: none;">
            <!-- Search Input Bar -->
            <div class="search-fullpage-bar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchFullpageInput" placeholder="Qidiruv...">
                <button class="search-close-circle" id="closeSearchBtn" aria-label="Close search">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <!-- Featured Stores Row -->
            <div class="search-stores-row" id="searchStoresRow">
                <!-- Loaded via JS -->
            </div>

            <!-- Search Results -->
            <div id="searchResultsArea">
                <div class="search-results-count" id="searchResultsCount" style="display:none;"></div>
                <div class="search-results-list" id="searchResultsList"></div>
                <div class="no-results-msg" id="noResultsMsg" style="display: none;">Hech narsa topilmadi</div>
            </div>
        </div>

        <!-- hidden legacy header input (search open handled by icon) -->
        <input type="text" id="headerSearchInput" style="display:none;" aria-hidden="true" tabindex="-1">
    </main>

    <!-- Floating footer controls -->
    <footer class="site-footer">
        <div class="footer-controls">
            <!-- Language Switcher -->
            <div class="lang-wrap" id="langWrap">
                <button class="lang-switch-btn" id="langBtn" aria-label="Change Language">
                    <span class="lang-text">UZ</span>
                    <svg class="lang-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="lang-dropdown" id="langDropdown">
                    <div class="lang-option" data-lang="uz">
                        O'zbek
                        <svg class="lang-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <div class="lang-option" data-lang="ru">
                        Русский
                        <svg class="lang-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Theme Toggle -->
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle theme">
                <span class="theme-icon theme-icon-sun">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
                </span>
                <span class="theme-icon theme-icon-moon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </span>
            </button>
        </div>
    </footer>

    <script src="js/config.js?v=4.7"></script>
    <script src="js/utils.js?v=4.7"></script>
    <script src="js/home.js?v=4.7"></script>

</body>

</html>
